# Local development override: exposes Postgres and the API directly on the
# host, skips Caddy/TLS entirely. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  db:
    ports:
      - "5432:5432"

  api:
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app

  worker:
    volumes:
      - ./backend/app:/app/app
