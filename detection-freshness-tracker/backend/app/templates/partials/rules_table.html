{% import "partials/badges.html" as b %}
<div class="table-card">
  <table>
    <thead>
      <tr>
        <th>Source</th>
        <th>Rule</th>
        <th>Status</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody>
      {% for rule in rules %}
      <tr>
        <td>{{ b.source_badge(rule.source.value) }}</td>
        <td><a href="{{ rule.html_url }}" target="_blank" rel="noopener">{{ rule.title }}</a></td>
        <td>{{ rule.status or "—" }}</td>
        <td class="mono">{{ rule.updated_date_native|date }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
