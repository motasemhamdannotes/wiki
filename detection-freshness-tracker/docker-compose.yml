name: detection-freshness-tracker

# Base stack: db + worker + api. On its own, api is reachable only from
# other containers on the compose network (`expose`, not `ports`) - nothing
# publishes it to the host yet. Pick exactly one of the two overlays below
# depending on what's already running on this VPS's ports 80/443:
#
#   - Something already serves other sites here (nginx/Apache/another
#     Caddy)? Use docker-compose.local-proxy.yml - it publishes api to
#     127.0.0.1 only, and you point that existing server's vhost/site
#     config for your subdomain at it. See deploy/ and README.md.
#       docker compose -f docker-compose.yml -f docker-compose.local-proxy.yml up -d --build
#
#   - Nothing else on 80/443 on this box? Use docker-compose.caddy.yml -
#     it adds the bundled Caddy, which owns 80/443 and handles TLS for
#     you automatically.
#       docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# Never combine both overlays, and never run either on a box where
# something else already holds the port it wants - only one process can
# bind a given port.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-detection_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-detection_tracker}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-detection_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - repo_cache:/data/repos

volumes:
  db_data:
  repo_cache:
